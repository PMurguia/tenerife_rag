[project]
name = "tenerife-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "PMurguia", email = "peiomurguia@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.6.9",
    "langchain-openai>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.4",
    "openai>=3.28.0",
    "openai-agents>=0.23.1",
    "pydantic>=2.14.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tzdata>=2026.5",
]

[project.scripts]
tenerife-rag = "tenerife_rag:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]
